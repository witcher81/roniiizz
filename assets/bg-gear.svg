<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#F5A623" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#E67E22" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="400" r="280" fill="url(#core)"/>
  <g transform="translate(400 400)" opacity="0.55">
    <circle r="220" stroke="url(#ring)" stroke-width="2" fill="none"/>
    <circle r="190" stroke="url(#ring)" stroke-width="1.5" fill="none" stroke-dasharray="8 14"/>
    <circle r="150" stroke="url(#ring)" stroke-width="3" fill="none"/>
    <circle r="120" stroke="url(#ring)" stroke-width="1" fill="none"/>
    <!-- mechanical teeth -->
    <g fill="url(#ring)">
      <rect x="-18" y="-250" width="36" height="40" rx="4"/>
      <rect x="-18" y="210" width="36" height="40" rx="4"/>
      <rect x="-250" y="-18" width="40" height="36" rx="4"/>
      <rect x="210" y="-18" width="40" height="36" rx="4"/>
      <g transform="rotate(45)"><rect x="-18" y="-250" width="36" height="40" rx="4"/></g>
      <g transform="rotate(135)"><rect x="-18" y="-250" width="36" height="40" rx="4"/></g>
      <g transform="rotate(225)"><rect x="-18" y="-250" width="36" height="40" rx="4"/></g>
      <g transform="rotate(315)"><rect x="-18" y="-250" width="36" height="40" rx="4"/></g>
    </g>
    <!-- circuit lines -->
    <g stroke="#F5A623" stroke-width="1.2" opacity="0.4" fill="none">
      <path d="M-80 0 H-40 M40 0 H80 M0 -80 V-40 M0 40 V80"/>
      <path d="M-60 -60 L-35 -35 M60 60 L35 35 M60 -60 L35 -35 M-60 60 L-35 35"/>
      <circle cx="-40" cy="0" r="3" fill="#F5A623"/>
      <circle cx="40" cy="0" r="3" fill="#F5A623"/>
      <circle cx="0" cy="-40" r="3" fill="#F5A623"/>
      <circle cx="0" cy="40" r="3" fill="#F5A623"/>
    </g>
  </g>
</svg>
